[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-importer"
version = "0.2.0"
description = "AI agent that imports any bank CSV into YNAB"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "requests>=2.28",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
ynab-importer = "ynab_importer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
