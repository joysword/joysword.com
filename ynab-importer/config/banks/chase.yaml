# Chase credit card CSV format
name: "Chase"
columns:
  date: "Transaction Date"
  payee: "Description"
  amount: "Amount"
  memo: "Memo"
date_format: "%m/%d/%Y"
# Chase: negative = purchase (outflow), positive = payment/refund (inflow)
amount_sign: "negative_is_outflow"
encoding: "utf-8"
delimiter: ","
# Optional: columns to identify this bank's CSV by header row
identify_headers:
  - "Transaction Date"
  - "Post Date"
  - "Description"
  - "Category"
  - "Type"
  - "Amount"
  - "Memo"
