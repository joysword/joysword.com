# YNAB API configuration
ynab:
  api_token: "YOUR_YNAB_API_TOKEN"  # Get from https://app.ynab.com/settings/developer
  budget_id: "YOUR_BUDGET_ID"        # Find in YNAB URL: app.ynab.com/{budget_id}/...

# LLM configuration
llm:
  model: "claude-sonnet-4-20250514"

# Folder watcher settings
watcher:
  settle_time_seconds: 2  # Wait for file to finish writing before processing
